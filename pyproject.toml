[project]
name = "agentic-financial-advisor"
version = "0.1.0"
description = "Personal financial advisor with an MCP server for market data, technicals, news, macro, and portfolio tracking."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "anthropic>=0.40.0",
    "yfinance>=0.2.50",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "prompt_toolkit>=3.0.47",
]

[project.scripts]
financial-mcp = "mcp_server.__main__:main"
advisor = "advisor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*", "advisor*"]
